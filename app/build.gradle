plugins {
    id 'com.android.application'
}

android {
    namespace 'com.strawing.fuckdevicepolicy'
    compileSdk 37 // libxposed service/interface 102 require compileSdk 37

    defaultConfig {
        applicationId "com.strawing.fuckdevicepolicy"
        minSdk 29      // Android 10+: where DISALLOW_INSTALL_UNKNOWN_SOURCES_GLOBALLY exists
        targetSdk 34   // kept below 35 so the old layout is not forced edge-to-edge
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.0'
    implementation 'androidx.navigation:navigation-ui:2.9.0'

    // Modern Xposed API (hooks, runs inside system_server) - provided by the framework at runtime
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Module-app <-> framework link (remote preferences, activation status)
    implementation 'io.github.libxposed:service:102.0.0'
}
